name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'assets/**'
      - 'fastlane/**'
      - '.github/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'assets/**'
      - 'fastlane/**'
      - '.github/**'

jobs:
  build-client:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.apk-list.outputs.files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout PipePipeExtractor composite build
        uses: actions/checkout@v4
        with:
          repository: InfinityLoop1308/PipePipeExtractor
          path: PipePipeExtractor

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Build debug APK
        working-directory: PipePipeClient-dev
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug lintDebug --stacktrace -DskipFormatKtlint

      - name: Upload all debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: all-debug-apks
          retention-days: 7
          path: PipePipeClient-dev/app/build/outputs/apk/debug/*.apk

      - name: Output APK filenames
        id: apk-list
        shell: bash
        run: |
          shopt -s nullglob
          files=(PipePipeClient-dev/app/build/outputs/apk/debug/*.apk)
          json="["
          first=true
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            if [ "$first" = true ]; then
              first=false
            else
              json+=","
            fi
            json+="\"$name\""
          done
          json+="]"
          echo "files=$json" >> "$GITHUB_OUTPUT"

  upload-individual-apks:
    runs-on: ubuntu-latest
    needs: build-client
    if: needs.build-client.outputs.files != '[]'
    strategy:
      matrix:
        file: ${{ fromJson(needs.build-client.outputs.files) }}
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: all-debug-apks
          path: apks

      - name: Upload individual APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: apks/${{ matrix.file }}
