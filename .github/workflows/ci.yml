name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - master
      - refactor
      - release**
      - material
      - pipe
      # Validate stacked PRs against their feature or fix base branch.
      - feature-**
      - fix-**
    paths-ignore:
      - 'README.md'
      # Keep the changelog and other existing docs covered by CI.
      - 'docs/android10-detail-rendering.md'
      - 'docs/imports/**'
      - 'docs/invidious-media-servers.md'
      - 'docs/launcher-icons.md'
      - 'docs/progressive-subscription-refresh.md'
      - 'docs/themes/**'
      - 'docs/tubebeam.md'
      - 'docs/yt-fifo.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches:
      - dev
      - master
      - material
      - pipe
    paths-ignore:
      - 'README.md'
      # Keep the changelog and other existing docs covered by CI.
      - 'docs/android10-detail-rendering.md'
      - 'docs/imports/**'
      - 'docs/invidious-media-servers.md'
      - 'docs/launcher-icons.md'
      - 'docs/progressive-subscription-refresh.md'
      - 'docs/themes/**'
      - 'docs/tubebeam.md'
      - 'docs/yt-fifo.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-jvm:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21.0.12+8.0.LTS
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK platform and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.1.0"

      - name: Verify source-inspection tests do not grow
        run: python3 scripts/check-source-inspection-tests.py "$(git rev-parse HEAD^)"

      - name: Verify Room schema bumps app version
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          python3 scripts/check-database-version-bump.py "origin/$BASE_REF"

      - name: Verify bundled changelog
        run: python3 scripts/generate-changelog.py --check

      - name: Test build validation scripts
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Build debug APK and run JVM tests
        run: >-
          ./gradlew assembleDebug lintDebug testDebugUnitTest :app:pluginSdkJar --stacktrace -DskipFormatKtlint
          --max-workers=2
          '-Dorg.gradle.jvmargs=-Xmx4096M --add-opens jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED'

      - name: Verify generated Room schemas match the checked-out commit
        run: python3 scripts/check-room-schemas.py

      - name: Upload generated Room schemas
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: room-schemas
          path: app/schemas/**
          if-no-files-found: ignore

      - name: Upload lint report when checks fail
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Verify 16 KB native-library compatibility
        run: |
          APK_PATH="$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          python3 scripts/check_android_16kb_elf.py "$APK_PATH"

      - name: Verify debug APK identity
        run: |
          APK_PATH="$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          BUILD_TOOLS_VERSION="36.1.0"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt"
          "$AAPT" dump badging "$APK_PATH" | tee "$RUNNER_TEMP/debug-apk-badging.txt"
          grep -q "package: name='org.wisso.newpipematerial.debug'" "$RUNNER_TEMP/debug-apk-badging.txt"
          grep -q "application-label:'WizeStream Debug'" "$RUNNER_TEMP/debug-apk-badging.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: wizestream-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build the documented WizeStream plugin template
        run: ./gradlew -p plugin-template generateSigningKey repositoryIndex --stacktrace --max-workers=2

      - name: Upload plugin SDK
        uses: actions/upload-artifact@v7
        with:
          name: wizestream-plugin-sdk
          path: app/build/outputs/plugin-sdk/wizestream-plugin-api.jar

      - name: Upload native plugin test package
        uses: actions/upload-artifact@v7
        with:
          name: native-plugin-test-package
          path: plugin-template/build/repo/*

  test-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Keep platform failures from cancelling coverage on the other Android versions.
      fail-fast: false
      matrix:
        include:
          - api-level: 23
            target: default
            arch: x86
          - api-level: 28
            target: default
            arch: x86_64
            # The API 28 quick-boot snapshot can lose package/activity services after resuming.
            extra-emulator-options: -no-snapshot-load
            # Exercise the legacy copy-toast path on the Android version reported in #522.
            test-options: -Pandroid.testInstrumentationRunnerArguments.class=org.schabi.newpipe.local.feed.quickadd.QuickAddStoreTest,org.schabi.newpipe.local.feed.preview.FeedPreviewControllerTest,org.schabi.newpipe.player.info.PlaybackInformationViewTest,org.schabi.newpipe.util.LegacyTextSelectionThemeTest,org.schabi.newpipe.sync.ProfileSyncIdentityCompatibilityTest,org.schabi.newpipe.player.video.VideoAdjustmentLifecycleTest,org.schabi.newpipe.player.video.VideoAdjustmentPlaybackTest,org.schabi.newpipe.player.pip.NativePipPlaybackTest,org.schabi.newpipe.player.ui.TvFullscreenFocusGuardTest,org.schabi.newpipe.player.gesture.PendingPlayerDragDispatchTest
          - api-level: 35
            target: default
            arch: x86_64
          # Reproduce playback-information bounds and scrolling on Android 17 (#1707).
          - api-level: '37.0'
            target: default
            arch: x86_64
            # Android 17 phone images require at least 4 GB of RAM.
            ram-size: 4096M
            avd-cache-version: v2
            pre-emulator-launch-script: grep -Fx 'target=android-37.0' "$ANDROID_AVD_HOME/test.ini"
            test-options: -Pandroid.testInstrumentationRunnerArguments.class=org.schabi.newpipe.player.info.PlaybackInformationViewTest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21.0.12+8.0.LTS
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK platform and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.1.0"

      # Older runner tools misread minor-versioned images as android-0, which
      # disables required graphics features and crashes Android 17 snapshots.
      - name: Install pinned Android 17 command-line tools
        if: matrix.api-level == '37.0'
        run: |
          API37_TOOLS_ARCHIVE="$RUNNER_TEMP/android-cmdline-tools-22.zip"
          curl --fail --location --retry 3 --output "$API37_TOOLS_ARCHIVE" \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          echo "040d3996a65543d22ec4bf73e4c37aa37a8d4af4  $API37_TOOLS_ARCHIVE" | sha1sum --check
          unzip -q "$API37_TOOLS_ARCHIVE" -d "$RUNNER_TEMP/android-cmdline-tools-22"
          mv "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/android-cmdline-tools-runner"
          mv "$RUNNER_TEMP/android-cmdline-tools-22/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version | grep -Fx '22.0'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare pinned external plugin test fixtures
        run: python3 scripts/prepare-plugin-test-fixtures.py

      - name: Cache Android emulator
        id: avd-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.arch }}-${{ matrix.avd-cache-version || 'v1' }}

      - name: Generate Android emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          ram-size: ${{ matrix.ram-size }}
          pre-emulator-launch-script: ${{ matrix.pre-emulator-launch-script }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          ram-size: ${{ matrix.ram-size }}
          pre-emulator-launch-script: ${{ matrix.pre-emulator-launch-script }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none ${{ matrix.extra-emulator-options }}
          script: bash scripts/connected-tests-with-previews.sh ${{ matrix.test-options }}

      - name: Upload player layout previews
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: player-layout-previews-api${{ matrix.api-level }}
          path: ${{ runner.temp }}/player-layout-previews/*.png
          if-no-files-found: ignore

      - name: Upload test report when tests fail
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-report-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/connected/**

  test-plugin-compatibility:
    needs: build-and-test-jvm
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 35]
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21.0.12+8.0.LTS
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK platform and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.1.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare pinned external plugin test fixtures
        run: python3 scripts/prepare-plugin-test-fixtures.py

      - name: Download native plugin built from the documented template
        uses: actions/download-artifact@v8
        with:
          name: native-plugin-test-package
          path: app/build/generated/native-plugin-package

      - name: Prepare native plugin test assets
        run: |
          cp app/build/generated/native-plugin-package/wizestream-example-1.ppp app/build/generated/plugin-test-assets/native-example.ppp
          cp app/build/generated/native-plugin-package/index.json app/build/generated/plugin-test-assets/native-index.json

      - name: Test external packages against the minified host
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            ./gradlew connectedPluginCompatibilityAndroidTest
            -PpluginCompatibilityTest=true -PreleaseAbi=x86_64
            -Pandroid.testInstrumentationRunnerArguments.class=org.schabi.newpipe.plugin.PipePipePackageCompatibilityTest
            -Pandroid.testInstrumentationRunnerArguments.requireNativePluginFixture=true
            --stacktrace --max-workers=2
            '-Dorg.gradle.jvmargs=-Xmx4096M --add-opens jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED'

      - name: Upload plugin compatibility reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plugin-compatibility-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
