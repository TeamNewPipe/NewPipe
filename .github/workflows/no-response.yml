name: No Response

# Both `issue_comment` and `scheduled` event types are required for this Action
# to work properly.
on:
  issue_comment:
    types: [created]
  schedule:
    # Run daily at midnight.
    - cron: '0 0 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  noResponse:
    runs-on: ubuntu-latest
    steps:
      - uses: tcely/no-response@v0.2.2
        with:
          token: ${{ github.token }}
          daysUntilClose: 14
          responseRequiredLabel: waiting for author
      - uses: tcely/no-response@v0.2.2
        with:
          token: ${{ github.token }}
          daysUntilClose: 14
          responseRequiredLabel: template missing
      - uses: tcely/no-response@v0.2.2
        with:
          token: ${{ github.token }}
          daysUntilClose: 14
          responseRequiredLabel: template ignored
