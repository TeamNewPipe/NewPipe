# Builds an installable APK of NewPipe_Search and publishes it under Releases.
# Runs on every push to the title-search branch, or by hand from the Actions tab.
name: Build NewPipe_Search APK

on:
  workflow_dispatch:
  push:
    branches:
      - title-search

# Run builds one at a time, so each build reuses the saved signing key.
concurrency:
  group: newpipe-search-apk
  cancel-in-progress: false

permissions:
  # Write access lets the last step publish the APK under Releases.
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      # Optional. Base64 of a keystore saved as a repository secret. A fixed key lets
      # every new build install over the previous one without losing app data.
      KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

      - name: set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: use signing key from secret
        if: env.KEYSTORE_B64 != ''
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 --decode > ~/.android/debug.keystore

      # Without the secret, keep the key that the first build generates, so later
      # builds still install as updates (GitHub drops caches unused for 7 days).
      - name: reuse signing key from earlier builds
        if: env.KEYSTORE_B64 == ''
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: title-search-debug-keystore-v1

      - name: build APK
        run: ./gradlew assembleContinuous --stacktrace -DskipFormatKtlint

      # Names every output "NewPipe_Search <build>", for example NewPipe_Search 1.0.2.
      - name: name the APK
        run: |
          CONFIG=buildSrc/src/main/kotlin/ProjectConfig.kt
          BASE=$(sed -n 's/^const val NEWPIPE_VERSION_NAME = "\(.*\)"$/\1/p' "$CONFIG")
          SUFFIX=$(sed -n 's/^const val TITLE_SEARCH_VERSION_SUFFIX = "\(.*\)"$/\1/p' "$CONFIG")
          if [ -z "$BASE" ] || [ -z "$SUFFIX" ]; then
            echo "Could not read the version from $CONFIG" >&2
            exit 1
          fi
          BUILD="${SUFFIX#-search.}"
          {
            echo "BASE=$BASE"
            echo "VERSION=${BASE}${SUFFIX}"
            echo "BUILD=$BUILD"
          } >> "$GITHUB_ENV"
          mkdir -p out
          cp app/build/outputs/apk/continuous/*.apk "out/NewPipe_Search-${BUILD}.apk"
          ls -l out

      - name: verify signature and supported Android versions
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls out/*.apk)
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt2" dump badging "$APK" \
            | grep -E "^package:|^application-label:|sdkVersion|native-code" || true

      - uses: actions/upload-artifact@v7
        with:
          name: NewPipe_Search-${{ env.BUILD }}
          path: out/*.apk
          if-no-files-found: error

      # Publishes the APK under the repository's Releases section, one release per
      # version. A new build of the same version replaces that release.
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v${VERSION}"
          ASSET="out/NewPipe_Search-${BUILD}.apk"

          # Remove releases published under the earlier name "NewPipe title search".
          gh release list --limit 100 --json tagName,name \
            --jq '.[] | select(.name | startswith("NewPipe title search")) | .tagName' \
            | while read -r OLD_TAG; do
                gh release delete "$OLD_TAG" --yes --cleanup-tag
              done

          cat > notes.md <<NOTES
          NewPipe_Search, based on NewPipe ${BASE}: search by title in the Playlists tab, local playlists, online playlists, and Subscriptions.

          **Install:** download NewPipe_Search-${BUILD}.apk below and open it on your Android phone (Android 6.0 or newer).
          App version: ${VERSION}.
          Full steps, including Samsung One UI settings: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/NEWPIPE_SEARCH.md

          Built from commit ${GITHUB_SHA::7}.
          NOTES

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "NewPipe_Search ${BUILD}" \
            --notes-file notes.md \
            --latest

      # Report only: the APK above is already uploaded when these run.
      - name: style checks and search tests
        continue-on-error: true
        run: >
          ./gradlew runCheckstyle runKtlint testDebugUnitTest
          --tests 'org.schabi.newpipe.util.TitleFilterTest'
          --stacktrace -DskipFormatKtlint
