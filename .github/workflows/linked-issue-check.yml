name: Check for linked issue

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-linked-issue:
    name: Check for linked issues and author being assigned to at least one issue
    if: >-
      !contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'),
        github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Dump Author Association
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          echo "Author Association: $AUTHOR_ASSOCIATION"

      - uses: actions/checkout@v6

      - name: Check linked issues
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const script = require('.github/workflows/linked-issue-check.js');
            await script({github, context});
