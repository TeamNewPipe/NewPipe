name: Build Patricio's IPTV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite ejecutar la compilación manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Conceder permisos a gradlew
      run: chmod +x gradlew

    - name: Compilar APK de Release
      run: ./gradlew assembleRelease

    - name: Subir APK generado como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: PatriciosIPTV-APK
        path: app/build/outputs/apk/release/*.apk
